[package]
name = "htlc-lock"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "htlc-lock"
path = "src/main.rs"

[dependencies]
ckb-std = { version = "1.1", default-features = false, features = ["allocator", "ckb-types", "dummy-atomic"] }
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
overflow-checks = true
strip = true

[workspace]
