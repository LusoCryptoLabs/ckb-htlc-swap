# Control only, never deployed by this repo: the spike lock from
# LusoCryptoLabs/cardano-ckb-isomorphic (main, spike/burn-gated-unlock/src/bin/htlc_lock.rs),
# built unchanged with its own ckb-std version, so the tests can show which cases it accepts
# that htlc-lock refuses.
[package]
name = "spike-htlc-lock"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "spike-htlc-lock"
path = "src/main.rs"

[dependencies]
ckb-std = "0.16"
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = true

[workspace]
